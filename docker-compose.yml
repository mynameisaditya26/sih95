version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: sih_inspection
  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://admin:password@mongo:27017/sih_inspection?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_me
      - CLIENT_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    depends_on:
      - mongo
      - ai-service
    volumes:
      - ./backend/uploads:/app/uploads
  ai-service:
    build: ./ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_AI=true
      - PORT=8000
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
volumes:
  mongo_data:
